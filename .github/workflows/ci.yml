name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.1', '1.26.6']
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Go ${{ matrix.go-version }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: go@${{ matrix.go-version }}
      - name: Cache Go
        uses: ./.github/actions/go-cache
      - name: Run tests
        run: mise exec go@${{ matrix.go-version }} -- mise test

  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Cache Go
        uses: ./.github/actions/go-cache
      - name: Check formatting
        run: mise format --check
      - name: Run linters
        run: mise lint --check
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Cache Go
        uses: ./.github/actions/go-cache
      - name: Run tests
        run: mise test
      - name: Run race tests
        run: mise test --race
      - name: Scan dependencies
        run: mise vuln

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Cache Go
        uses: ./.github/actions/go-cache
      - name: Run E2E tests
        run: mise e2e
