version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: gomod
    directory: /
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /testapp/lambda
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: terraform
    directory: /infra
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /infra
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
